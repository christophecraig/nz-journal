[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 200

[[redirects]]
  from = "/conditions"
  to = "/conditions.html"
  status = 200

[[redirects]]
  from = "/jour/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=()"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex"
